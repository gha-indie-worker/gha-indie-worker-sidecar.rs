name: Rust CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghaiw-sidecar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false

      - name: Verify exact candidate revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Report Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Authored Rust formatting is clean
        run: rustfmt --edition 2021 --check src/lib.rs src/log_tee.rs

      - name: Authored library Clippy is warning-free
        run: cargo clippy --locked --lib -- -D warnings

      - name: Check all Rust targets
        run: cargo check --locked --all-targets

      - name: Test all Rust targets
        run: cargo test --locked --all-targets

      - name: Test optimized build
        run: cargo test --locked --all-targets --release
