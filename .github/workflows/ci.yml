name: Rust CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghaiw-sidecar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false

      - name: Verify exact candidate revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Report Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Authored Rust formatting is clean
        run: rustfmt --edition 2021 --check src/lib.rs src/log_tee.rs src/main.rs src/pipe.rs

      - name: Authored Rust Clippy is warning-free
        run: |
          cargo clippy --locked --lib -- -D warnings
          cargo clippy --locked --bin ghaiw-sidecar -- -D warnings

      - name: Check all Rust targets
        run: cargo check --locked --all-targets

      - name: Test all Rust targets
        run: cargo test --locked --all-targets

      - name: Exercise stdin plus FD3 receiver protocol
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --bin ghaiw-sidecar
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          python3 - <<'PY' >"$tmp/frames.bin"
          import sys
          def frame(stream, data):
              sys.stdout.buffer.write(b"GHLG" + bytes([1, stream]) + len(data).to_bytes(4, "big") + data)
          frame(1, b"live-out\n")
          frame(2, b"live-err\n")
          PY

          GHAIW_LOG_SIDECAR_PROTOCOL=gha-indie-worker.log-sidecar.v1 \
          GHAIW_LOG_SIDECAR_METADATA_FD=3 \
            ./target/debug/ghaiw-sidecar \
            3< <(printf '%s\n' '{"schemaVersion":"gha-indie-worker.log-sidecar.v1","event":"command_started"}') \
            <"$tmp/frames.bin" >"$tmp/stdout" 2>"$tmp/stderr"

          test "$(cat "$tmp/stdout")" = "live-out"
          grep -Fx 'live-err' "$tmp/stderr"
          grep -F '[ghaiw-meta] {"schemaVersion":"gha-indie-worker.log-sidecar.v1","event":"command_started"}' "$tmp/stderr"

      - name: Test optimized build
        run: cargo test --locked --all-targets --release
