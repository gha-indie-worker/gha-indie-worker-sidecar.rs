name: verify oreslang-format pr9

on:
  pull_request:
    paths:
      - 'mirror/oreslang-format/**'
      - '.github/workflows/verify-oreslang-format-pr9.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - name: Test exact mirrored formatter tree
        run: cargo test --all-targets --manifest-path mirror/oreslang-format/Cargo.toml
