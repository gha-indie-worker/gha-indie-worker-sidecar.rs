name: ORES static observability IDs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-observability-ids:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ores-otel/ores-otel-monorepo/.github/actions/ores-trace-contract@15ee9dfce00e98e399c509c47f4efd7f6577a128
