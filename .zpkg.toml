[package]
org = "gha-indie-worker"
name = "gha-indie-worker-sidecar"
version = "0.1.0"
description = "Sidecar for GHA Indie Worker."
license = "MIT"
keywords = ["sidecar", "observability", "k8s"]
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/gha-indie-worker/gha-indie-worker-sidecar.rs"

[dependencies]
"ores-otel/ores-otel-sidecar" = "^0.1.0"

[build]
command = "cargo build --release --locked --bin ghaiw-sidecar"
outputs = ["target/release/ghaiw-sidecar"]

[bin]
ghaiw-sidecar = "target/release/ghaiw-sidecar"

[install]
adapter = "none"

[scripts]
test = "cargo test --all-targets --locked"
