# flags-2-env surface for `gha-indie-worker-sidecar`
[identity]
service = "gha-indie-worker-sidecar"
type_name = "SidecarEnv"

[help]
url = "https://github.com/gha-indie-worker/gha-indie-worker-sidecar.rs"
columns = ["options", "env", "type", "default", "description"]

[parse]
allow_unknown = false

[flags.bind]
env = "GHA_INDIE_WORKER_SIDECAR_BIND"
long = "bind"
type = "string"
default = "127.0.0.1:9090"
help = "HTTP listen address for /healthz /readyz /metrics."
